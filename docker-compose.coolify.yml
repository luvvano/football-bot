services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-football}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-football}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-football} -d ${POSTGRES_DB:-football}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-football}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-football}?sslmode=disable
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_WEBAPP_URL=${TELEGRAM_WEBAPP_URL}
      - API_PORT=8080
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.football-api.rule=Host(`football-api.luvano.pro`)"
      - "traefik.http.routers.football-api.entrypoints=https"
      - "traefik.http.routers.football-api.tls=true"
      - "traefik.http.routers.football-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.football-api.loadbalancer.server.port=8080"

  frontend:
    build:
      context: ./miniapp
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://football-api.luvano.pro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.football-app.rule=Host(`football.luvano.pro`)"
      - "traefik.http.routers.football-app.entrypoints=https"
      - "traefik.http.routers.football-app.tls=true"
      - "traefik.http.routers.football-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.football-app.loadbalancer.server.port=80"

volumes:
  postgres_data:
